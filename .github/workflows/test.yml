name: Test
on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unit tests (recorded API responses)
        run: node --test tests/lib.test.mjs
      - name: Phone notifications server (nginx with njs)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx libnginx-mod-http-js
          sudo env "PATH=$PATH" node tests/push.mjs  # nginx runs as root in the test
      - name: Browser smoke test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.0 axe-core@4.10.2
          npx playwright install --with-deps chromium
          node tests/smoke.mjs
