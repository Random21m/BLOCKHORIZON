# tools/release.conf: BLOCKHORIZON's details for tools/release.sh (the same script as every other repo).
NAME=BLOCKHORIZON
REPO=Random21m/BLOCKHORIZON
SITE=https://random21m.github.io/BLOCKHORIZON
SITE_ROOT=
# the files .github/workflows/pages.yml publishes (keep the two lists the same)
SITE_FILES=(index.html embed.html embed.css style.css sw.js manifest.webmanifest privacy.html config.json icons src docs)
VERSION_FILE=src/state.js
VERSION_RE="export const VERSION = '[0-9.]*'"
CHECKS=("sw.js|const CACHE = 'blockhorizon-v{V}';")
# files in main to attach to the release too; () for none
ASSETS=()
