manifestVersion: 1
id: blockhorizon
storage:
  dataRoot: data
category: bitcoin
name: BLOCKHORIZON
version: "0.19.0"
tagline: A calm, live Bitcoin dashboard where time is measured in blocks
description: >-
  BLOCKHORIZON shows your node's view of Bitcoin on one calm screen: the block height, the next halving,
  the difficulty adjustment, hashrate, fees, the mempool and the blocks on their way.


  It also draws the next block being mined live, sounds alarms at a block height, price or fee level, has a
  clock mode for a spare screen, history charts and a live trading chart, and "your block": the block mined on
  a day that matters to you.


  On Umbrel it reads block, fee, mempool and transaction data from your own Mempool app, so your browser never
  asks a third party for it. The price comes from Kraken's public feed (Coinbase's while Kraken is down). No
  accounts and no tracking; settings stay in your browser.
releaseNotes: >-
  Watch your own addresses: on the Alarm page, add up to 10 Bitcoin addresses and get a sound and a message when a
  payment to one of them is seen, and again once it is confirmed. With "On your phone" turned on, your node tells
  your phone too. Addresses are only looked up on your own node.


  Also new: Chinese, Korean, Russian and Brazilian Portuguese (13 languages in all), and the live price keeps going
  from Coinbase's public feed while Kraken's is down.

developer: Random21m
